<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="inkBlur">
      <feGaussianBlur stdDeviation="1" />
    </filter>
    <filter id="inkDiffuse">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="inkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1d1a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#3d3a35" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6b665e" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <g opacity="0.15">
    <ellipse cx="30" cy="30" rx="25" ry="15" fill="url(#inkGradient)" filter="url(#inkDiffuse)"/>
    <ellipse cx="170" cy="90" rx="30" ry="18" fill="url(#inkGradient)" filter="url(#inkDiffuse)"/>
    <ellipse cx="100" cy="60" rx="20" ry="12" fill="url(#inkGradient)" filter="url(#inkDiffuse)"/>
    <path d="M10,60 Q50,40 90,60" stroke="#3d3a35" stroke-width="2" fill="none" filter="url(#inkBlur)" opacity="0.2"/>
    <path d="M110,60 Q150,80 190,60" stroke="#3d3a35" stroke-width="1.5" fill="none" filter="url(#inkBlur)" opacity="0.15"/>
    <path d="M40,100 Q60,90 80,100" stroke="#6b665e" stroke-width="1" fill="none" filter="url(#inkBlur)" opacity="0.1"/>
    <path d="M120,20 Q140,30 160,20" stroke="#6b665e" stroke-width="1" fill="none" filter="url(#inkBlur)" opacity="0.1"/>
  </g>
  <g opacity="0.08">
    <circle cx="20" cy="20" r="8" fill="#b08d57"/>
    <circle cx="180" cy="100" r="6" fill="#5a7a6e"/>
    <circle cx="100" cy="10" r="4" fill="#a93226"/>
    <circle cx="100" cy="110" r="5" fill="#b08d57"/>
  </g>
  <g opacity="0.05">
    <line x1="0" y1="40" x2="200" y2="40" stroke="#3d3a35" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#3d3a35" stroke-width="0.5"/>
    <line x1="50" y1="0" x2="50" y2="120" stroke="#3d3a35" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="120" stroke="#3d3a35" stroke-width="0.5"/>
  </g>
</svg>