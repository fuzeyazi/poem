<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="inkBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="inkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1d1a" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#3d3a35" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6b665e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="30" fill="url(#inkGrad)" filter="url(#inkBlur)">
    <animate attributeName="r" values="5;25;35;40" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.5;0.3;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="15" fill="url(#inkGrad)" filter="url(#inkBlur)">
    <animate attributeName="r" values="3;12;18;22" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;0.4;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="50" r="5" fill="#1f1d1a" filter="url(#inkBlur)">
    <animate attributeName="r" values="1;4;6;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.9;0.7;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>