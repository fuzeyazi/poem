<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <defs>
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" seed="12"/>
      <feColorMatrix values="0 0 0 0 0.18  0 0 0 0 0.15  0 0 0 0 0.11  0 0 0 0.08 0"/>
    </filter>
    <filter id="fibers">
      <feTurbulence type="turbulence" baseFrequency="0.04 0.002" numOctaves="3" stitchTiles="stitch" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="warmEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efe7d5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f7f2e8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e8dfc8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#f7f2e8"/>
  <rect width="100%" height="100%" fill="url(#warmEdge)"/>
  <rect width="100%" height="100%" filter="url(#paperTexture)"/>
  <rect width="100%" height="100%" fill="#f7f2e8" filter="url(#fibers)" opacity="0.3"/>
  <g opacity="0.03">
    <line x1="0" y1="0" x2="240" y2="240" stroke="#3d3a35" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="0" y2="240" stroke="#3d3a35" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="240" y2="80" stroke="#3d3a35" stroke-width="0.3"/>
    <line x1="0" y1="160" x2="240" y2="160" stroke="#3d3a35" stroke-width="0.3"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#3d3a35" stroke-width="0.3"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#3d3a35" stroke-width="0.3"/>
  </g>
</svg>