<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <defs>
    <filter id="sealTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="sealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a93226"/>
      <stop offset="50%" stop-color="#9a2f23"/>
      <stop offset="100%" stop-color="#8a2c1f"/>
    </linearGradient>
    <filter id="sealShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#5a1a14" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#sealShadow)">
    <rect x="2" y="2" width="56" height="56" rx="3" fill="url(#sealGradient)" filter="url(#sealTexture)"/>
    <rect x="5" y="5" width="50" height="50" rx="2" fill="none" stroke="#fdfaf2" stroke-width="1.5" opacity="0.2"/>
    <rect x="8" y="8" width="44" height="44" rx="1" fill="none" stroke="#fdfaf2" stroke-width="0.5" opacity="0.1"/>
    <text x="30" y="28" font-family="serif" font-size="20" font-weight="bold" fill="#fdfaf2" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">诗</text>
    <text x="30" y="45" font-family="serif" font-size="14" fill="#fdfaf2" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">韵</text>
    <circle cx="12" cy="12" r="2" fill="#fdfaf2" opacity="0.3"/>
    <circle cx="48" cy="48" r="2" fill="#fdfaf2" opacity="0.3"/>
    <circle cx="48" cy="12" r="1.5" fill="#fdfaf2" opacity="0.2"/>
    <circle cx="12" cy="48" r="1.5" fill="#fdfaf2" opacity="0.2"/>
  </g>
</svg>